
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIDEO HUB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090611;color:white;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;background:#160c29;border-bottom:1px solid #bd8cff}
h1{color:#e5bd65;letter-spacing:3px}
.hero{padding:55px 20px;text-align:center;background:linear-gradient(135deg,#210d40,#080510)}
.hero h2{font-size:30px;color:#eacb82}
.hero p{color:#c9b8dc}
button{background:linear-gradient(90deg,#b47aff,#e6bd65);border:0;border-radius:25px;padding:13px 25px;font-weight:bold;color:#130b20}
.container{padding:20px}
.card{background:#1a1128;border:1px solid #493064;border-radius:15px;padding:18px;margin:15px 0}
.price{color:#eacb82;font-weight:bold}
footer{text-align:center;padding:25px;color:#a99bb8}
</style>
</head>
<body>
<header><h1>VIDEO HUB 🔞</h1></header>
<section class="hero">
<h2>Welcome to VIDEO HUB</h2>
<p>Premium Video Experience</p>
<button>Explore Videos</button>
</section>
<div class="container">
<div class="card">
<h3>Video Collection</h3>
<p>Discover our video collection.</p>
<p class="price">TSh 1,000 / video</p>
<button>View Details</button>
</div>
<div class="card">
<h3>Secure Account</h3>
<p>Register and verify your email to continue.</p>
<button>Sign Up</button>
</div>
</div>
<footer>VIDEO HUB © 2026</footer>
</body>
</html>
